name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -e ".[dev]"

      - name: Run Ruff Check
        run: ruff check src tests

      - name: Run Ruff Format Check
        run: ruff format --check src tests

      - name: Run Mypy Typecheck
        run: mypy src

  backend-test:
    name: Backend Test Suite (Coverage >= 80%)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install CPU PyTorch & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,ml,explain]"

      - name: Run Pytest with Coverage Gate
        run: pytest --cov=news_sentiment --cov-report=term-missing --cov-fail-under=80 -m 'not slow'

  frontend:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run Vitest Suite
        working-directory: frontend
        run: npm test

      - name: Build Production Bundle
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: newsent-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: newsent-frontend:test
