[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "news-sentiment"
version = "0.1.0"
description = "News Sentiment Analyzer: classification, explainability, and trend tracking"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Dhrupal", email = "dhrupalsinhsolanki97@gmail.com" }
]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "tenacity>=8.2.0",
    "feedparser>=6.0.10",
    "vaderSentiment>=3.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.9.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
    "httpx>=0.27.0",
    "respx>=0.23.0",
]
ml = [
    "transformers>=4.40.0",
    "torch>=2.0.0",
]
explain = [
    "captum>=0.7.0",
    "shap>=0.45.0",
]

[project.scripts]
newsent = "news_sentiment.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/news_sentiment"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "feedparser.*",
    "vaderSentiment.*",
    "transformers.*",
    "torch.*",
    "captum.*",
    "shap.*",
]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: marks tests as slow (deselected by default, run with -m slow)",
]
addopts = "--cov=news_sentiment --cov-report=term-missing -m 'not slow'"
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore::DeprecationWarning:feedparser.*",
    "ignore::DeprecationWarning:alembic.*",
    "ignore::ResourceWarning",
]

[tool.coverage.run]
source = ["src/news_sentiment"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
